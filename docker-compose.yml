version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Core Agritech Swarm Backend API
  # Member 1: ML Triad + RAG + Guardrails | Member 2: LangGraph + Mandi + Docker
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agritech-backend
    ports:
      - "8000:8000"
    environment:
      # Groq Whisper STT / English translation
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3}
      - GROQ_API_TIMEOUT_SECONDS=${GROQ_API_TIMEOUT_SECONDS:-60}
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-qwen/qwen3.8-27b}
      - GROQ_LLM_TIMEOUT_SECONDS=${GROQ_LLM_TIMEOUT_SECONDS:-30}
      # Sarvam TTS
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_TTS_MODEL=${SARVAM_TTS_MODEL:-bulbul:v3}
      - SARVAM_TTS_SPEAKER=${SARVAM_TTS_SPEAKER:-shubh}
      - SARVAM_TTS_TIMEOUT_SECONDS=${SARVAM_TTS_TIMEOUT_SECONDS:-60}
      # Agmarknet Mandi API (Member 2)
      - DATA_GOV_API_KEY=${DATA_GOV_API_KEY:-579b464db66ec23bdd000001cdd3946e44ce4afd5208dbe48c4876b4}
      # Database Paths (inside container)
      - DB_PATH=artifacts/icar_knowledge.db
      - FAISS_INDEX_PATH=artifacts/icar_faiss.index
      - MANDI_DB_PATH=data/mandi_cache.db
      - VOICE_CACHE_DB_PATH=data/voice_cache.db
      # Logging
      - LOG_LEVEL=INFO
    volumes:
      # Persist SQLite databases and model artifacts across container restarts
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - agritech-net

  # ─────────────────────────────────────────────────────────────────────────────
  # Streamlit Dual-Pane Frontend
  # Member 3: Farmer Voice Interface + Judge Verification Console
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agritech-frontend
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3}
      - GROQ_API_TIMEOUT_SECONDS=${GROQ_API_TIMEOUT_SECONDS:-60}
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-qwen/qwen3.8-27b}
      - GROQ_LLM_TIMEOUT_SECONDS=${GROQ_LLM_TIMEOUT_SECONDS:-30}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_TTS_MODEL=${SARVAM_TTS_MODEL:-bulbul:v3}
      - SARVAM_TTS_SPEAKER=${SARVAM_TTS_SPEAKER:-shubh}
      - SARVAM_TTS_TIMEOUT_SECONDS=${SARVAM_TTS_TIMEOUT_SECONDS:-60}
    networks:
      - agritech-net
    restart: unless-stopped
    profiles:
      - frontend  # Only start with: docker-compose --profile frontend up

networks:
  agritech-net:
    driver: bridge
